<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" font-family="'Arial Narrow',Impact,sans-serif">
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#2a0810"/>
      <stop offset="45%" stop-color="#e60012"/>
      <stop offset="100%" stop-color="#160305"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0%" stop-color="#ff9aa3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff9aa3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ht" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="2.4" fill="#000" opacity="0.16"/>
    </pattern>
  </defs>

  <!-- full opaque image so it can fill the panel AND show through the letters -->
  <rect width="480" height="720" fill="url(#bgp)"/>
  <rect width="480" height="720" fill="url(#spot)"/>
  <rect width="480" height="720" fill="url(#ht)"/>

  <!-- figure -->
  <g fill="#fff" opacity="0.92">
    <circle cx="240" cy="232" r="92"/>
    <path d="M150 720 C150 470 178 392 240 392 C302 392 330 470 330 720 Z"/>
  </g>

  <!-- top label -->
  <g>
    <rect x="0" y="0" width="480" height="40" fill="#0c0c0e"/>
    <text x="18" y="27" fill="#fff" font-size="17" font-weight="bold" letter-spacing="3">FOTO ARTISTA</text>
    <text x="462" y="27" fill="#e60012" font-size="15" font-weight="bold" letter-spacing="1" text-anchor="end">SOSTITUISCI ►</text>
  </g>

  <!-- spec chip -->
  <g>
    <rect x="158" y="664" width="164" height="30" fill="#0c0c0e"/>
    <text x="240" y="685" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1" font-family="monospace">PNG · 480×720</text>
  </g>
</svg>

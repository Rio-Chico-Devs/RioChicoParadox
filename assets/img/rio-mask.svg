<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" preserveAspectRatio="none">
  <!-- "RIO" Impact, rotated 90° CCW so the base of each letter faces LEFT.
       R top / I middle / O bottom. white = image shows through. -->
  <text x="50" y="22" fill="white"
        font-family="Impact,'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900"
        font-size="139" textLength="42" lengthAdjust="spacingAndGlyphs"
        text-anchor="middle" dominant-baseline="middle"
        transform="rotate(90,50,22)">R</text>

  <rect x="0" y="44" width="100" height="42" fill="white"/>

  <text x="50" y="108" fill="white"
        font-family="Impact,'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900"
        font-size="139" textLength="42" lengthAdjust="spacingAndGlyphs"
        text-anchor="middle" dominant-baseline="middle"
        transform="rotate(90,50,108)">O</text>
</svg>

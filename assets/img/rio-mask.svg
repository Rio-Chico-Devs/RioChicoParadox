<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" preserveAspectRatio="none">
  <!--
    R : cy=21 tL=50  → actual y≈0..44   (touches top border)
    gap: y=44..57  (13u)
    I : y=57..75   h=18  (leggermente più larga)
    gap: y=75..88  (13u)
    O : cy=112 tL=52 → specified y=86..138 overflows bottom → clipped at y=130
        (ensures O visually fills to bottom border regardless of browser metrics)
  -->
  <text x="50" y="21" fill="white"
        font-family="Impact,'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900"
        font-size="130" textLength="50" lengthAdjust="spacingAndGlyphs"
        text-anchor="middle" dominant-baseline="middle"
        transform="rotate(90,50,21)">R</text>

  <rect x="0" y="57" width="100" height="18" fill="white"/>

  <text x="50" y="112" fill="white"
        font-family="Impact,'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900"
        font-size="130" textLength="52" lengthAdjust="spacingAndGlyphs"
        text-anchor="middle" dominant-baseline="middle"
        transform="rotate(90,50,112)">O</text>
</svg>

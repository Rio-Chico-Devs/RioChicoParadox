<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480">
  <defs>
    <radialGradient id="gbg05" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#030303"/>
    </radialGradient>
    <radialGradient id="gctr05" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#888888" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0"/>
    </radialGradient>
    <filter id="gbl05"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <rect width="480" height="480" fill="url(#gbg05)"/>

  <!-- grid overlay -->
  <g opacity="0.035" stroke="#888888" stroke-width="0.5">
    <line x1="0" y1="80" x2="480" y2="80"/><line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="0" y1="240" x2="480" y2="240"/><line x1="0" y1="320" x2="480" y2="320"/>
    <line x1="0" y1="400" x2="480" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="480"/><line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/><line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
  </g>

  <!-- main glow -->
  <ellipse cx="240" cy="240" rx="180" ry="180" fill="url(#gctr05)" filter="url(#gbl05)"/>

  
    <!-- sketch/lineart aesthetic -->
    <rect x="60" y="60" width="360" height="360" fill="none" stroke="#888888" 
          stroke-width="0.8" stroke-opacity="0.2" stroke-dasharray="4,3"/>
    <!-- sketchy figure lines -->
    <ellipse cx="240" cy="170" rx="55" ry="62" fill="none" stroke="#888888" 
             stroke-width="1.5" stroke-opacity="0.3"/>
    <path d="M185,228 Q240,210 295,228 L305,390 L240,405 L175,390 Z" 
          fill="none" stroke="#888888" stroke-width="1.5" stroke-opacity="0.25"/>
    <!-- cross-hatching suggestion -->
    <line x1="60" y1="300" x2="420" y2="60" stroke="#888888" stroke-width="0.5" stroke-opacity="0.08"/>
    <line x1="60" y1="340" x2="380" y2="60" stroke="#888888" stroke-width="0.5" stroke-opacity="0.08"/>
    <line x1="100" y1="420" x2="420" y2="100" stroke="#888888" stroke-width="0.5" stroke-opacity="0.08"/>
    <!-- pencil marks -->
    <line x1="90" y1="450" x2="390" y2="450" stroke="#888888" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- frame corners -->
  <path d="M12,12 L42,12 L42,15 L15,15 L15,42 L12,42 Z" fill="#888888" opacity="0.5"/>
  <path d="M468,12 L438,12 L438,15 L465,15 L465,42 L468,42 Z" fill="#888888" opacity="0.5"/>
  <path d="M12,468 L42,468 L42,465 L15,465 L15,438 L12,438 Z" fill="#888888" opacity="0.5"/>
  <path d="M468,468 L438,468 L438,465 L465,465 L465,438 L468,438 Z" fill="#888888" opacity="0.5"/>

  <!-- card number -->
  <text x="22" y="38" font-family="monospace" font-size="9" fill="#888888" 
        opacity="0.6" letter-spacing="1">NO.05</text>

  <!-- bottom bar -->
  <rect x="0" y="450" width="480" height="30" fill="#888888" opacity="0.08"/>
  <text x="240" y="469" text-anchor="middle" font-family="monospace" font-size="9" 
        fill="#888888" opacity="0.8" letter-spacing="4">LINE ART</text>
  <text x="456" y="469" text-anchor="end" font-family="monospace" font-size="8" 
        fill="#888888" opacity="0.4" letter-spacing="1">Sketch</text>
</svg>
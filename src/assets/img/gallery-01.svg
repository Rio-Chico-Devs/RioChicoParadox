<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480">
  <defs>
    <radialGradient id="gbg01" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="gctr01" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#cc0000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#cc0000" stop-opacity="0"/>
    </radialGradient>
    <filter id="gbl01"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <rect width="480" height="480" fill="url(#gbg01)"/>

  <!-- grid overlay -->
  <g opacity="0.035" stroke="#cc0000" stroke-width="0.5">
    <line x1="0" y1="80" x2="480" y2="80"/><line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="0" y1="240" x2="480" y2="240"/><line x1="0" y1="320" x2="480" y2="320"/>
    <line x1="0" y1="400" x2="480" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="480"/><line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/><line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
  </g>

  <!-- main glow -->
  <ellipse cx="240" cy="240" rx="180" ry="180" fill="url(#gctr01)" filter="url(#gbl01)"/>

  
    <!-- large diagonal energy slash -->
    <polygon points="0,200 200,0 480,0 480,100 280,480 0,480" fill="#cc0000" opacity="0.06"/>
    <line x1="80" y1="0" x2="480" y2="480" stroke="#cc0000" stroke-width="60" stroke-opacity="0.04"/>
    <!-- abstract figure suggestion -->
    <ellipse cx="240" cy="170" rx="65" ry="72" fill="#cc0000" opacity="0.08"/>
    <rect x="195" y="235" width="90" height="160" rx="4" fill="#cc0000" opacity="0.07"/>
    <!-- sword diagonal -->
    <line x1="100" y1="480" x2="400" y2="60" stroke="#cc0000" stroke-width="3" stroke-opacity="0.25"/>
    <line x1="103" y1="480" x2="403" y2="60" stroke="#cc0000" stroke-width="1" stroke-opacity="0.15"/>
    <!-- energy particles -->
    <circle cx="200" cy="200" r="4" fill="#cc0000" opacity="0.4"/>
    <circle cx="310" cy="150" r="3" fill="#cc0000" opacity="0.3"/>
    <circle cx="160" cy="300" r="2" fill="#cc0000" opacity="0.25"/>
    <circle cx="350" cy="350" r="5" fill="#cc0000" opacity="0.2"/>

  <!-- frame corners -->
  <path d="M12,12 L42,12 L42,15 L15,15 L15,42 L12,42 Z" fill="#cc0000" opacity="0.5"/>
  <path d="M468,12 L438,12 L438,15 L465,15 L465,42 L468,42 Z" fill="#cc0000" opacity="0.5"/>
  <path d="M12,468 L42,468 L42,465 L15,465 L15,438 L12,438 Z" fill="#cc0000" opacity="0.5"/>
  <path d="M468,468 L438,468 L438,465 L465,465 L465,438 L468,438 Z" fill="#cc0000" opacity="0.5"/>

  <!-- card number -->
  <text x="22" y="38" font-family="monospace" font-size="9" fill="#cc0000" 
        opacity="0.6" letter-spacing="1">NO.01</text>

  <!-- bottom bar -->
  <rect x="0" y="450" width="480" height="30" fill="#cc0000" opacity="0.08"/>
  <text x="240" y="469" text-anchor="middle" font-family="monospace" font-size="9" 
        fill="#cc0000" opacity="0.8" letter-spacing="4">FEATURED PIECE</text>
  <text x="456" y="469" text-anchor="end" font-family="monospace" font-size="8" 
        fill="#cc0000" opacity="0.4" letter-spacing="1">OC</text>
</svg>
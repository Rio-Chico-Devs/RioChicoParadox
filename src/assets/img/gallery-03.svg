<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480">
  <defs>
    <radialGradient id="gbg03" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#001525"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="gctr03" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#0077cc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0077cc" stop-opacity="0"/>
    </radialGradient>
    <filter id="gbl03"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <rect width="480" height="480" fill="url(#gbg03)"/>

  <!-- grid overlay -->
  <g opacity="0.035" stroke="#0077cc" stroke-width="0.5">
    <line x1="0" y1="80" x2="480" y2="80"/><line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="0" y1="240" x2="480" y2="240"/><line x1="0" y1="320" x2="480" y2="320"/>
    <line x1="0" y1="400" x2="480" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="480"/><line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/><line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
  </g>

  <!-- main glow -->
  <ellipse cx="240" cy="240" rx="180" ry="180" fill="url(#gctr03)" filter="url(#gbl03)"/>

  
    <!-- wide scene with horizon line -->
    <rect x="0" y="300" width="480" height="180" fill="#0077cc" opacity="0.05"/>
    <line x1="0" y1="300" x2="480" y2="300" stroke="#0077cc" stroke-width="1.5" stroke-opacity="0.3"/>
    <!-- two figures suggestion -->
    <ellipse cx="160" cy="200" rx="45" ry="52" fill="#0077cc" opacity="0.1"/>
    <rect x="130" y="248" width="60" height="110" fill="#0077cc" opacity="0.08"/>
    <ellipse cx="320" cy="195" rx="40" ry="48" fill="#0077cc" opacity="0.07"/>
    <rect x="294" y="238" width="52" height="110" fill="#0077cc" opacity="0.06"/>
    <!-- speed lines -->
    <line x1="240" y1="0" x2="0" y2="480" stroke="#0077cc" stroke-width="0.8" stroke-opacity="0.08"/>
    <line x1="240" y1="0" x2="480" y2="480" stroke="#0077cc" stroke-width="0.8" stroke-opacity="0.08"/>

  <!-- frame corners -->
  <path d="M12,12 L42,12 L42,15 L15,15 L15,42 L12,42 Z" fill="#0077cc" opacity="0.5"/>
  <path d="M468,12 L438,12 L438,15 L465,15 L465,42 L468,42 Z" fill="#0077cc" opacity="0.5"/>
  <path d="M12,468 L42,468 L42,465 L15,465 L15,438 L12,438 Z" fill="#0077cc" opacity="0.5"/>
  <path d="M468,468 L438,468 L438,465 L465,465 L465,438 L468,438 Z" fill="#0077cc" opacity="0.5"/>

  <!-- card number -->
  <text x="22" y="38" font-family="monospace" font-size="9" fill="#0077cc" 
        opacity="0.6" letter-spacing="1">NO.03</text>

  <!-- bottom bar -->
  <rect x="0" y="450" width="480" height="30" fill="#0077cc" opacity="0.08"/>
  <text x="240" y="469" text-anchor="middle" font-family="monospace" font-size="9" 
        fill="#0077cc" opacity="0.8" letter-spacing="4">BATTLE SCENE</text>
  <text x="456" y="469" text-anchor="end" font-family="monospace" font-size="8" 
        fill="#0077cc" opacity="0.4" letter-spacing="1">Fanart</text>
</svg>